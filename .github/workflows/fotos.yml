# Baixa as fotos listadas em assets/img/fotos.txt e salva no repositório.
name: Baixar fotos

on:
  push:
    paths: ["assets/img/fotos.txt"]

permissions:
  contents: write

jobs:
  fotos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Baixar
        run: |
          grep -v '^#' assets/img/fotos.txt | while read -r f u; do
            [ -n "$f" ] || continue
            curl -fsSL "$u" -o "assets/img/$f" && echo "::notice::$f $(stat -c%s assets/img/$f) bytes" || echo "::error::falhou $f"
          done
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add assets/img/*.jpg
          git diff --cached --quiet || git commit -m "Fotos baixadas de assets/img/fotos.txt"
          git push
