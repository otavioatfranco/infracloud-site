# Publica o site na KingHost via FTP sempre que algo entra na branch main.
# Credenciais ficam em Settings > Secrets and variables > Actions:
#   FTP_HOST  ex.: ftp.infracloud.com.br
#   FTP_USER  usuário FTP do painel KingHost
#   FTP_PASS  senha FTP
#   FTP_DIR   pasta pública do site no FTP, terminando em / (na KingHost normalmente: www/)
name: Publicar na KingHost

on:
  push:
    branches: [main]
  workflow_dispatch: # botão "Run workflow" pra publicar manualmente

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Testar conexão com o FTP
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
        run: |
          for h in "$FTP_HOST" web15f74.uni5.net; do
            label=$([ "$h" = "$FTP_HOST" ] && echo "FTP_HOST" || echo "host alternativo")
            ips=$(getent ahosts "$h" | awk '{print $1}' | sort -u | tr '\n' ' ')
            if [ -z "$ips" ]; then echo "::warning::$label: DNS não resolve"; continue; fi
            fam=$(echo "$ips" | grep -q ':' && echo "tem IPv6" || echo "só IPv4")
            if timeout 10 bash -c "</dev/tcp/$h/21" 2>/dev/null; then
              echo "::notice::$label: porta 21 ABERTA ($fam)"
            else
              echo "::warning::$label: porta 21 SEM RESPOSTA ($fam)"
            fi
          done

      - name: Listar pastas do FTP
        env:
          H: ${{ secrets.FTP_HOST }}
          U: ${{ secrets.FTP_USER }}
          P: ${{ secrets.FTP_PASS }}
          D: ${{ secrets.FTP_DIR }}
        run: |
          echo "::notice::FTP_DIR tem ${#D} caracteres; com espaço: $([[ "$D" =~ [[:space:]] ]] && echo sim || echo não); começa com /: $([[ "$D" == /* ]] && echo sim || echo não)"
          root=$(curl -s -4 --max-time 30 --list-only --user "$U:$P" "ftp://$H/" | tr '\r\n' '  ')
          echo "::notice::Raiz do FTP: $root"
          www=$(curl -s -4 --max-time 30 --list-only --user "$U:$P" "ftp://$H/www/" | tr '\r\n' '  ')
          echo "::notice::Dentro de www/: $www"

      - name: Enviar arquivos por FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          server-dir: ${{ secrets.FTP_DIR }}
          timeout: 60000
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            README.md
