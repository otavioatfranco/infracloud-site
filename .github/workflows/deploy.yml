# Publica o site na KingHost via FTP sempre que algo entra na branch main.
# Credenciais ficam em Settings > Secrets and variables > Actions:
#   FTP_HOST  ex.: ftp.infracloud.com.br
#   FTP_USER  usuário FTP do painel KingHost
#   FTP_PASS  senha FTP
name: Publicar na KingHost

on:
  push:
    branches: [main]
  workflow_dispatch: # botão "Run workflow" pra publicar manualmente

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolver IPv4 do FTP
        id: ftp
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
        run: |
          ip=$(getent ahostsv4 "$FTP_HOST" | awk 'NR==1{print $1}')
          [ -n "$ip" ] || { echo "::error::Não consegui resolver o FTP_HOST"; exit 1; }
          echo "ip=$ip" >> "$GITHUB_OUTPUT"

      - name: Enviar arquivos por FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ steps.ftp.outputs.ip }}   # IPv4 direto: o IPv6 da KingHost falha às vezes
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          server-dir: ./   # na KingHost o FTP já abre na pasta pública do site
          timeout: 60000
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            README.md
